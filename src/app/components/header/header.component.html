<header class="pixel-header-root">
  <!-- Paisaje de fondo Retro Pixel Art -->
  <div class="scenery-container">
    <!-- Cielo y nubes pixeladas -->
    <div class="sky-background">
      <!-- Pájaros pixelados volando -->
      <div class="pixel-bird bird-1">
        <svg viewBox="0 0 12 6" class="pixel-svg-bird">
          <path d="M0,2 h2 v-2 h2 v2 h4 v-2 h2 v2 h2 v2 h-2 v-1 h-2 v1 h-4 v-1 h-2 v1 h-2 z" fill="#2d3748" />
        </svg>
      </div>
      <div class="pixel-bird bird-2">
        <svg viewBox="0 0 10 5" class="pixel-svg-bird">
          <path d="M0,2 h2 v-2 h1 v2 h4 v-2 h1 v2 h2 v1 h-2 v-1 h-1 v1 h-4 v-1 h-1 v1 h-2 z" fill="#334155" />
        </svg>
      </div>

      <!-- Nubes pixeladas -->
      <div class="pixel-cloud cloud-left"></div>
      <div class="pixel-cloud cloud-center"></div>
      <div class="pixel-cloud cloud-right"></div>
    </div>

    <!-- Castillo pixelado a la izquierda -->
    <div class="pixel-castle-wrapper">
      <svg viewBox="0 0 100 80" class="pixel-scenery-svg castle-svg">
        <!-- Torre izquierda -->
        <rect x="5" y="15" width="20" height="65" fill="#64748b" />
        <rect x="5" y="10" width="6" height="6" fill="#475569" />
        <rect x="19" y="10" width="6" height="6" fill="#475569" />
        <polygon points="15,0 3,12 27,12" fill="#7f1d1d" />
        <!-- Banderín torre izquierda -->
        <polygon points="15,0 15,-6 24,-3" fill="#eab308" />

        <!-- Torre central alta -->
        <rect x="35" y="5" width="30" height="75" fill="#718096" />
        <rect x="35" y="0" width="8" height="6" fill="#475569" />
        <rect x="47" y="0" width="8" height="6" fill="#475569" />
        <rect x="57" y="0" width="8" height="6" fill="#475569" />
        <polygon points="50,-12 33,5 67,5" fill="#991b1b" />
        <!-- Bandera castillo central -->
        <line x1="50" y1="-12" x2="50" y2="-22" stroke="#1e293b" stroke-width="2" />
        <polygon points="50,-22 66,-17 50,-12" fill="#facc15" />

        <!-- Muralla con almenas -->
        <rect x="25" y="35" width="50" height="45" fill="#525e6f" />
        <rect x="25" y="30" width="8" height="6" fill="#334155" />
        <rect x="45" y="30" width="10" height="6" fill="#334155" />
        <rect x="67" y="30" width="8" height="6" fill="#334155" />

        <!-- Puerta de madera con arco -->
        <rect x="42" y="55" width="16" height="25" fill="#451a03" />
        <circle cx="50" cy="55" r="8" fill="#451a03" />
        <line x1="50" y1="52" x2="50" y2="80" stroke="#78350f" stroke-width="2" />

        <!-- Ventanas de aspillera -->
        <rect x="47" y="18" width="6" height="12" fill="#0f172a" />
        <rect x="12" y="28" width="6" height="10" fill="#0f172a" />
      </svg>
    </div>

    <!-- Montañas nevadas y pinos a la derecha -->
    <div class="pixel-mountains-wrapper">
      <svg viewBox="0 0 140 80" class="pixel-scenery-svg mountains-svg">
        <!-- Montaña fondo -->
        <polygon points="30,80 75,10 120,80" fill="#475569" />
        <polygon points="75,10 65,26 73,23 79,28 85,24" fill="#f8fafc" />

        <!-- Montaña frontal derecha con nieve -->
        <polygon points="60,80 105,18 140,80" fill="#334155" />
        <polygon points="105,18 94,32 102,30 110,36 118,31" fill="#ffffff" />

        <!-- Árboles pinos pixelados -->
        <!-- Pino 1 -->
        <polygon points="15,80 15,70 12,70 16,60 13,60 17,50 17,45 20,45 20,50 24,60 21,60 25,70 22,70 22,80" fill="#14532d" />
        <!-- Pino 2 -->
        <polygon points="35,80 35,72 32,72 36,63 33,63 37,54 37,49 40,49 40,54 44,63 41,63 45,72 42,72 42,80" fill="#166534" />
        <!-- Pino 3 -->
        <polygon points="125,80 125,70 122,70 126,58 123,58 127,48 127,43 130,43 130,48 134,58 131,58 135,70 132,70 132,80" fill="#15803d" />
      </svg>
    </div>
  </div>

  <!-- Contenido Central del Header -->
  <div class="header-main-content">
    
    <!-- TÍTULO SUPERIOR: VAMOO (Estilo Pixel Art 3D destacado) -->
    <div class="brand-title-container">
      <div class="pixel-title-box">
        <h1 class="pixel-logo-vamoo" title="Vamoo">
          <span class="p-char char-v">V</span><span class="p-char char-a">A</span><span class="p-char char-m">M</span><span class="p-char char-o1">O</span><span class="p-char char-o2">O</span>
        </h1>
        <div class="logo-sub-badge">PIXEL ADVENTURE</div>
      </div>
    </div>

    <!-- BOTONERA DE NAVEGACIÓN (Estilo cinta poligonal retro interconectada) -->
    <nav class="nav-ribbon-bar" aria-label="Navegación principal">
      @for (btn of navButtons; track btn.id) {
        <button
          type="button"
          class="pixel-nav-btn shape-{{ btn.shapeType }} theme-{{ btn.colorTheme }}"
          [class.active]="activeBtn() === btn.id"
          (click)="selectNav(btn.id)"
          [attr.aria-label]="btn.label"
        >
          <!-- Contenido Interior con Bisel -->
          <span class="btn-inner">
            <!-- Icono Pixel Art -->
            <span class="btn-icon">
              @switch (btn.iconType) {
                @case ('inicio') {
                  <!-- Casita Pixel Art -->
                  <svg viewBox="0 0 24 24" class="svg-pixel-icon">
                    <!-- Techo rojo/marrón -->
                    <path d="M12,2 L2,11 L4,11 L4,22 L10,22 L10,14 L14,14 L14,22 L20,22 L20,11 L22,11 Z" fill="#b91c1c" />
                    <!-- Chimenea -->
                    <rect x="16" y="4" width="3" height="6" fill="#78350f" />
                    <!-- Humo -->
                    <rect x="17" y="1" width="2" height="2" fill="#e2e8f0" />
                    <!-- Pared beige -->
                    <rect x="5" y="11" width="14" height="10" fill="#fde68a" />
                    <!-- Puerta madera -->
                    <rect x="10" y="14" width="4" height="7" fill="#58240c" />
                    <rect x="13" y="17" width="1" height="1" fill="#facc15" />
                    <!-- Ventana -->
                    <rect x="6" y="13" width="3" height="3" fill="#38bdf8" />
                    <rect x="15" y="13" width="3" height="3" fill="#38bdf8" />
                    <!-- Borde negro pixel -->
                    <path d="M12,1 L1,11 H3 V23 H11 V15 H13 V23 H21 V11 H23 L12,1 Z" fill="none" stroke="#111827" stroke-width="1.8" />
                  </svg>
                }
                @case ('jugar') {
                  <!-- Espada Pixel Art -->
                  <svg viewBox="0 0 24 24" class="svg-pixel-icon">
                    <!-- Hoja de espada en diagonal -->
                    <path d="M18,3 L21,3 L21,6 L10,17 L7,17 L7,14 Z" fill="#e2e8f0" />
                    <path d="M19,3 L21,3 L21,5 L11,15 L9,15 L9,13 Z" fill="#ffffff" />
                    <!-- Guarda de la espada -->
                    <rect x="5" y="14" width="8" height="3" transform="rotate(-45 9 15.5)" fill="#ca8a04" stroke="#18181b" stroke-width="1.2" />
                    <!-- Mango y empuñadura -->
                    <rect x="4" y="18" width="4" height="3" transform="rotate(45 6 19.5)" fill="#78350f" />
                    <!-- Pomo dorado -->
                    <circle cx="3.5" cy="21.5" r="2" fill="#eab308" stroke="#18181b" stroke-width="1.2" />
                    <!-- Contorno negro -->
                    <path d="M18,2 L22,2 L22,6 L11,17 L8,20 L4,20 L3,23 L1,21 L4,17 L4,13 L7,13 Z" fill="none" stroke="#090a0f" stroke-width="1.5" />
                  </svg>
                }
                @case ('comunidad') {
                  <!-- Grupo / Personas Pixel Art -->
                  <svg viewBox="0 0 24 24" class="svg-pixel-icon">
                    <!-- Persona central -->
                    <rect x="9.5" y="3" width="5" height="5" fill="#fed7aa" stroke="#18181b" stroke-width="1.2" />
                    <path d="M7,9 H17 V17 H7 Z" fill="#991b1b" stroke="#18181b" stroke-width="1.2" />
                    <!-- Persona izquierda -->
                    <rect x="4" y="5" width="4" height="4" fill="#fecaca" stroke="#18181b" stroke-width="1.2" />
                    <path d="M2,10 H8 V17 H2 Z" fill="#1e40af" stroke="#18181b" stroke-width="1.2" />
                    <!-- Persona derecha -->
                    <rect x="16" y="5" width="4" height="4" fill="#bbf7d0" stroke="#18181b" stroke-width="1.2" />
                    <path d="M16,10 H22 V17 H16 Z" fill="#15803d" stroke="#18181b" stroke-width="1.2" />
                  </svg>
                }
                @case ('login') {
                  <!-- Llave dorada Pixel Art -->
                  <svg viewBox="0 0 24 24" class="svg-pixel-icon">
                    <!-- Cabeza circular de la llave -->
                    <circle cx="8" cy="12" r="5" fill="#facc15" stroke="#18181b" stroke-width="1.5" />
                    <circle cx="8" cy="12" r="2.2" fill="#713f12" />
                    <!-- Vástago de la llave -->
                    <rect x="12" y="10.5" width="9" height="3" fill="#facc15" stroke="#18181b" stroke-width="1.2" />
                    <!-- Dientes de la llave -->
                    <rect x="16" y="13.5" width="2" height="3" fill="#ca8a04" stroke="#18181b" stroke-width="1.2" />
                    <rect x="19" y="13.5" width="2" height="4" fill="#ca8a04" stroke="#18181b" stroke-width="1.2" />
                  </svg>
                }
                @case ('register') {
                  <!-- Pergamino / Pergamino antiguo Pixel Art -->
                  <svg viewBox="0 0 24 24" class="svg-pixel-icon">
                    <!-- Hoja del pergamino con esquinas enrolladas -->
                    <path d="M5,4 H19 V19 H5 Z" fill="#fef3c7" stroke="#18181b" stroke-width="1.5" />
                    <!-- Enrollado superior -->
                    <rect x="4" y="2" width="16" height="3" fill="#fde68a" stroke="#18181b" stroke-width="1.2" />
                    <!-- Enrollado inferior -->
                    <rect x="4" y="18" width="16" height="3" fill="#fde68a" stroke="#18181b" stroke-width="1.2" />
                    <!-- Líneas de escritura rúnica -->
                    <line x1="8" y1="8" x2="16" y2="8" stroke="#92400e" stroke-width="1.8" stroke-dasharray="2,1" />
                    <line x1="8" y1="11" x2="16" y2="11" stroke="#92400e" stroke-width="1.8" stroke-dasharray="2,1" />
                    <line x1="8" y1="14" x2="13" y2="14" stroke="#92400e" stroke-width="1.8" stroke-dasharray="2,1" />
                    <!-- Sello de cera roja -->
                    <circle cx="16" cy="15" r="2" fill="#dc2626" />
                  </svg>
                }
              }
            </span>

            <!-- Texto del Botón en Fuente Pixel -->
            <span class="btn-label">{{ btn.label }}</span>
          </span>
        </button>
      }
    </nav>

  </div>
</header>
