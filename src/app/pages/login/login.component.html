<section class="login-page-wrapper">
  <!-- Partículas y destellos de fondo en pixel art -->
  <div class="ambient-pixel-particles">
    <div class="sparkle sp-1"></div>
    <div class="sparkle sp-2"></div>
    <div class="sparkle sp-3"></div>
    <div class="sparkle sp-4"></div>
  </div>

  <!-- CUADRO PIXELADO PRINCIPAL (Ventana de Diálogo RPG) -->
  <div class="pixel-dialog-box" role="dialog" aria-labelledby="login-title">
    
    <!-- Esquinas ornamentales pixeladas -->
    <div class="pixel-corner corner-tl"></div>
    <div class="pixel-corner corner-tr"></div>
    <div class="pixel-corner corner-bl"></div>
    <div class="pixel-corner corner-br"></div>

    <!-- Barra de Título Superior de la Ventana -->
    <div class="dialog-header-banner">
      <div class="header-banner-inner">
        <span class="header-icon">
          <!-- Llave dorada pixelada -->
          <svg viewBox="0 0 24 24" class="svg-pixel-sm">
            <circle cx="8" cy="12" r="5" fill="#facc15" stroke="#18181b" stroke-width="1.5" />
            <circle cx="8" cy="12" r="2" fill="#713f12" />
            <rect x="12" y="10.5" width="9" height="3" fill="#facc15" stroke="#18181b" stroke-width="1.2" />
            <rect x="16" y="13.5" width="2" height="3" fill="#ca8a04" stroke="#18181b" stroke-width="1.2" />
            <rect x="19" y="13.5" width="2" height="4" fill="#ca8a04" stroke="#18181b" stroke-width="1.2" />
          </svg>
        </span>
        <h2 id="login-title" class="dialog-title">INICIAR SESIÓN</h2>
      </div>
    </div>

    <!-- Cuerpo del Formulario Pixelado -->
    <div class="dialog-body">
      <p class="dialog-subtitle">INGRESA TUS CREDENCIALES PARA CONTINUAR LA AVENTURA</p>

      <!-- Alertas de estado en pixel art -->
      @if (errorMessage()) {
        <div class="pixel-alert alert-error" role="alert">
          <span class="alert-icon">⚠️</span>
          <span class="alert-text">{{ errorMessage() }}</span>
        </div>
      }

      @if (successMessage()) {
        <div class="pixel-alert alert-success" role="status">
          <span class="alert-icon">⭐</span>
          <span class="alert-text">{{ successMessage() }}</span>
        </div>
      }

      <form (ngSubmit)="onSubmit()" class="login-form" novalidate>
        
        <!-- Campo: Usuario / Email -->
        <div class="form-group">
          <label for="username" class="pixel-label">
            <span class="label-badge">👤</span>
            <span>AVENTURERO / EMAIL:</span>
          </label>
          <div class="pixel-input-wrapper">
            <span class="input-icon">📜</span>
            <input
              type="text"
              id="username"
              name="username"
              class="pixel-input"
              placeholder="Ej. SirPixel_99"
              [ngModel]="username()"
              (ngModelChange)="username.set($event)"
              autocomplete="username"
              required
            />
          </div>
        </div>

        <!-- Campo: Contraseña -->
        <div class="form-group">
          <label for="password" class="pixel-label">
            <span class="label-badge">🔑</span>
            <span>CONTRASEÑA:</span>
          </label>
          <div class="pixel-input-wrapper">
            <span class="input-icon">🔒</span>
            <input
              [type]="showPassword() ? 'text' : 'password'"
              id="password"
              name="password"
              class="pixel-input"
              placeholder="••••••••"
              [ngModel]="password()"
              (ngModelChange)="password.set($event)"
              autocomplete="current-password"
              required
            />
            <button
              type="button"
              class="btn-toggle-eye"
              (click)="togglePasswordVisibility()"
              [title]="showPassword() ? 'Ocultar contraseña' : 'Ver contraseña'"
              aria-label="Alternar visibilidad de contraseña"
            >
              {{ showPassword() ? '👁️' : '🙈' }}
            </button>
          </div>
        </div>

        <!-- Opciones secundarias: Recordar y Olvido -->
        <div class="form-row-options">
          <label class="pixel-checkbox-label">
            <input
              type="checkbox"
              class="pixel-native-checkbox"
              [checked]="rememberMe()"
              (change)="rememberMe.set(!rememberMe())"
            />
            <span class="pixel-checkbox-custom" [class.checked]="rememberMe()"></span>
            <span class="checkbox-text">RECORDAR SESIÓN</span>
          </label>

          <a href="javascript:void(0)" class="pixel-link-muted">
            ¿OLVIDASTE LA CLAVE?
          </a>
        </div>

        <!-- Botón Principal de Envío (Estilo botón LOGIN del Header) -->
        <div class="form-actions">
          <button
            type="submit"
            class="pixel-submit-btn"
            [disabled]="isLoading()"
          >
            <span class="submit-btn-inner">
              <span class="submit-btn-icon">
                @if (isLoading()) {
                  ⏳
                } @else {
                  ⚔️
                }
              </span>
              <span class="submit-btn-text">
                {{ isLoading() ? 'VERIFICANDO...' : 'ENTRAR AL JUEGO' }}
              </span>
            </span>
          </button>
        </div>

        <!-- Separador Pixel Art -->
        <div class="pixel-divider-or">
          <span class="divider-line"></span>
          <span class="divider-or-badge">O TAMBIÉN</span>
          <span class="divider-line"></span>
        </div>

        <!-- Botón de Autenticación con Google -->
        <button
          type="button"
          class="pixel-google-btn"
          (click)="loginWithGoogle()"
          [disabled]="isLoading()"
        >
          <span class="google-btn-inner">
            <svg class="google-svg-icon" viewBox="0 0 24 24" width="18" height="18">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            <span class="google-btn-text">CONTINUAR CON GOOGLE</span>
          </span>
        </button>

        <!-- Separador Pixel Art -->
        <div class="pixel-divider">
          <span class="divider-line"></span>
          <span class="divider-gem">💎</span>
          <span class="divider-line"></span>
        </div>

        <!-- Enlace a Registro -->
        <div class="register-callout">
          <span class="callout-text">¿AÚN NO ERES MIEMBRO DEL GREMIO?</span>
          <button
            type="button"
            class="pixel-btn-secondary"
            (click)="goToRegister()"
          >
            CREAR NUEVA CUENTA
          </button>
        </div>

      </form>
    </div>

  </div>
</section>
